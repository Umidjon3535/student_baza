{% extends "talabalar/base.html" %}
{% block content %}
<h3 class="mb-4">{{ sarlavha }}</h3>
<div class="card p-4" style="max-width:600px">
  <p><i class="bi bi-exclamation-triangle text-danger me-1"></i>Haqiqatan ham <b>{{ object }}</b> yozuvini o'chirmoqchimisiz?</p>
  <form method="post">{% csrf_token %}
    <button class="btn btn-danger"><i class="bi bi-trash me-1"></i>Ha, o'chirish</button>
    <a href="{{ orqaga_url }}" class="btn btn-outline-secondary">Bekor qilish</a>
  </form>
</div>
{% endblock %}
