{% extends "talabalar/base.html" %}
{% block content %}
<div class="d-flex flex-wrap gap-2 justify-content-between align-items-center mb-4">
  <h3 class="mb-0">{{ sarlavha }}</h3>
  <a href="{{ orqaga_url }}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Orqaga</a>
</div>
<div class="card p-4">
  <form method="post" novalidate>{% csrf_token %}
    {% for e in form.non_field_errors %}<div class="alert alert-danger">{{ e }}</div>{% endfor %}
    <div class="row g-3">
      {% for field in form %}
        <div class="col-md-6">
          <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="text-danger">*</span>{% endif %}</label>
          {{ field }}
          {% for e in field.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}
        </div>
      {% endfor %}
    </div>
    <button class="btn btn-primary mt-4"><i class="bi bi-check-lg me-1"></i>Saqlash</button>
  </form>
</div>
{% endblock %}
